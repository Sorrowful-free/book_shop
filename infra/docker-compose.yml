services:
  postgres:
    image: postgres:17-alpine
    container_name: book-shop-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: book-shop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: book-shop-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: book-shop-kafka-init
    # Storage-format bug workaround is already in kafka.listeners; this one-shot
    # container just creates the domain topics then exits.
    command:
      - sh
      - -c
      - |
        for t in auth.user.events catalog.book.events order.order.events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic $$t \
            --partitions 1 --replication-factor 1
        done
    depends_on:
      kafka:
        condition: service_healthy

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: book-shop-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: book-shop
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # -----------------------------------------------------------------------
  # MinIO-compatible object store for book covers (spec 08 §2) — private
  # `book-covers` bucket, owned by catalog-service. The browser uploads
  # directly via presigned POST, so :9000 must stay published to the host.
  #
  # Image: pgsty/silo is the maintained MinIO fork — upstream removed
  # minio/minio and minio/mc from Docker Hub (Sept 2026) and quay.io now
  # requires auth. Same S3 API, MINIO_* env, /minio/* health routes and `mc`
  # CLI; one image serves both this service and minio-init below.
  # -----------------------------------------------------------------------

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    container_name: book-shop-minio
    command: server /data --console-address ":9001"
    environment:
      # dev-only credentials, same convention as postgres/postgres
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API — needed by the BROWSER for the presigned POST
      - "9001:9001" # console (dev convenience)
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    container_name: book-shop-minio-init
    # one-shot, like kafka-init: create the private bucket (mc mb is private
    # by default) then exit — `--ignore-existing` keeps re-runs green.
    command:
      - sh
      - -c
      - |
        mc alias set minio http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing minio/book-covers
    depends_on:
      minio:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Demo apps — profile `apps` (docs/specs/07-docker.md). `bun run infra:up`
  # (no profile) still starts infra only; `bun run apps:up` builds and starts
  # everything. gRPC ports are deliberately NOT published — the only host
  # endpoints are api-gateway :3000 and web :3001. Requires the JWT secrets
  # below — generate once with `bun run infra:secrets`.
  # -------------------------------------------------------------------------

  auth-service:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.service
      args:
        APP: auth-service
        PRISMA_SCHEMA: apps/auth-service/prisma/schema.prisma
    profiles: ["apps"]
    env_file: docker/apps.env
    secrets:
      - jwt_private
      - jwt_public
    environment:
      GRPC_PORT: "50051"
      DATABASE_URL: postgresql://auth_user:auth_pass@postgres:5432/auth_db
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private
      # demo stack: seed the admin account at bootstrap (in-app, idempotent)
      SEED_ADMIN_USER_NAME: admin
      SEED_ADMIN_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bun -e 'const s = require("net").connect(Number(process.env.GRPC_PORT), "127.0.0.1", () => { s.end(); process.exit(0); }); s.on("error", () => process.exit(1));'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  catalog-service:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.service
      args:
        APP: catalog-service
        PRISMA_SCHEMA: apps/catalog-service/prisma/schema.prisma
    profiles: ["apps"]
    env_file: docker/apps.env
    secrets:
      - jwt_public
    environment:
      GRPC_PORT: "50052"
      DATABASE_URL: postgresql://catalog_user:catalog_pass@postgres:5432/catalog_db
      # covers (spec 08): ops calls hit the internal endpoint; presigns are
      # computed for the host-published one so browser uploads match the sig
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      # idempotent book seed, run by the entrypoint before the service starts
      RUN_SEED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bun -e 'const s = require("net").connect(Number(process.env.GRPC_PORT), "127.0.0.1", () => { s.end(); process.exit(0); }); s.on("error", () => process.exit(1));'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  cart-service:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.service
      args:
        APP: cart-service
    profiles: ["apps"]
    env_file: docker/apps.env
    secrets:
      - jwt_public
    environment:
      GRPC_PORT: "50053"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bun -e 'const s = require("net").connect(Number(process.env.GRPC_PORT), "127.0.0.1", () => { s.end(); process.exit(0); }); s.on("error", () => process.exit(1));'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  order-service:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.service
      args:
        APP: order-service
        PRISMA_SCHEMA: apps/order-service/prisma/schema.prisma
    profiles: ["apps"]
    env_file: docker/apps.env
    secrets:
      - jwt_public
    environment:
      GRPC_PORT: "50054"
      DATABASE_URL: postgresql://order_user:order_pass@postgres:5432/order_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bun -e 'const s = require("net").connect(Number(process.env.GRPC_PORT), "127.0.0.1", () => { s.end(); process.exit(0); }); s.on("error", () => process.exit(1));'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  api-gateway:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.service
      args:
        APP: api-gateway
    profiles: ["apps"]
    env_file: docker/apps.env
    secrets:
      - jwt_public
    environment:
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bun -e 'fetch("http://127.0.0.1:" + (process.env.PORT || 3000) + "/api/v1/books?limit=1").then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
    profiles: ["apps"]
    environment:
      # runtimeConfig override for the built .output (nuxt.config.ts is not
      # executed there) — BFF proxy target is the internal gateway address
      NUXT_GATEWAY_URL: http://api-gateway:3000
      # nitro listens on PORT (not NUXT_PORT); bind all interfaces
      PORT: "3001"
      HOST: 0.0.0.0
    ports:
      - "3001:3001"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e 'fetch("http://127.0.0.1:" + (process.env.PORT || 3001) + "/").then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

secrets:
  jwt_private:
    file: ./secrets/jwt_private.pem
  jwt_public:
    file: ./secrets/jwt_public.pem

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  minio-data:
