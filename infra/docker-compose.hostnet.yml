# Build-only workaround for hosts where containers can't reach external DNS
# (e.g. VPN/firewall that drops outbound UDP:53 from bridge networks —
# see infra/README.md). Merge it in ONLY for the build step:
#
#   docker compose -f infra/docker-compose.yml \
#     -f infra/docker-compose.hostnet.yml --profile apps build
#   docker compose -f infra/docker-compose.yml --profile apps up -d
#
# Runtime service discovery does NOT need external DNS (compose embedded
# resolver handles service names), so `up` uses the plain file.
services:
  auth-service:
    build:
      network: host
  catalog-service:
    build:
      network: host
  cart-service:
    build:
      network: host
  order-service:
    build:
      network: host
  api-gateway:
    build:
      network: host
  web:
    build:
      network: host
