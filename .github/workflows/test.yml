name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma clients
        run: bun run db:generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Start infra
        run: |
          docker compose -f infra/docker-compose.yml up -d --wait postgres redis kafka kafka-init
          docker compose -f infra/docker-compose.yml wait kafka-init

      - name: Run tests
        run: bun test
