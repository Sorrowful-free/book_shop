name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma clients
        run: bun run db:generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Start infra
        run: |
          docker compose -f infra/docker-compose.yml up -d --wait postgres redis kafka minio
          # one-shot init containers must stay out of the --wait list: if
          # they exit before compose's first status poll, `up --wait`
          # reports "container exited (0)" as a failure. Start them
          # detached, then block on their real exit codes (DEFERRED T4).
          docker compose -f infra/docker-compose.yml up -d kafka-init minio-init
          docker compose -f infra/docker-compose.yml wait kafka-init minio-init

      - name: Run tests
        run: bun test
